<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SGG - Nuevo Usuario</h1>
        <button id="theme-toggle" aria-label="Alternar modo claro/oscuro">
    <img src="img/luna.svg" id="theme-icon" alt="Alternar Tema">
</button>
    </header>

    <main>
        <section class="register-container">
            <h2>Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="nombre">Nombre/s:</label>
                    <input type="text" id="nombre" name="nombre" required pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" title="Solo se permiten letras">
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido/s:</label>
                    <input type="text" id="apellido" name="apellido" required pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" title="Solo se permiten letras">
                </div>

                <div class="form-group">
                    <label for="fecha-nac">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha-nac" name="fecha-nac" required aria-describedby="edad-ayuda">
                    <small id="edad-ayuda">Debes ser mayor de 14 años.</small>
                </div>

                <div class="form-group">
                    <label for="email-reg">Correo Electrónico:</label>
                    <input type="email" id="email-reg" name="email-reg" required placeholder="usuario@empresa.com.ar">
                </div>
                
                <div class="form-group password-group">
                    <label for="password-reg">Contraseña:</label>
                    <input type="password" id="password-reg" name="password-reg" required>
                    <button type="button" class="toggle-password" aria-controls="password-reg" aria-label="Mostrar contraseña">
                        <img src="img/ver.svg" alt="Ver contraseña" width="24" height="24">
                    </button>
                </div>

                <ul id="password-requirements" aria-live="polite">
                    <li id="req-length" class="req-invalid">Mínimo 8 caracteres</li>
                    <li id="req-upper" class="req-invalid">Al menos 1 letra Mayúscula</li>
                    <li id="req-lower" class="req-invalid">Al menos 1 letra Minúscula</li>
                    <li id="req-num" class="req-invalid">Al menos 1 número</li>
                    <li id="req-spec" class="req-invalid">Al menos 1 carácter especial</li>
                </ul>

                <div class="form-group password-group">
                    <label for="password-rep">Repetir Contraseña:</label>
                    <input type="password" id="password-rep" name="password-rep" required>
                    <button type="button" class="toggle-password" aria-controls="password-rep" aria-label="Mostrar contraseña">
                        <img src="img/ver.svg" alt="Ver contraseña" width="24" height="24">
                    </button>
                </div>

                <button type="submit" id="btn-register" disabled>Registrarse</button>
            </form>

            <nav class="auth-links">
                <a href="index.html">Volver al Inicio de Sesión</a>
            </nav>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="js/db.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
