<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sistema de Gestión de Gastos</h1>
        <button id="theme-toggle" aria-label="Alternar modo claro/oscuro">
    <img src="img/luna.svg" id="theme-icon" alt="Alternar Tema">
</button>
    </header>

    <main>
        <section class="login-container">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="usuario@empresa.com">
                </div>
                
                <div class="form-group password-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="********">
                    <button type="button" class="toggle-password" aria-controls="password" aria-label="Mostrar contraseña">
                        <img src="img/ver.svg" alt="Ver contraseña" width="24" height="24">
                    </button>
                </div>

                <div id="login-error" class="error-message" aria-live="polite"></div>

                <button type="submit" id="btn-login">Ingresar</button>
            </form>

            <nav class="auth-links">
                <a href="registro.html">¿No tienes cuenta? Regístrate aquí</a>
                <br>
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </nav>
        </section>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
